name: ci

# Lint, types, tests, then retrieval quality.
#
# The last of those is the unusual one: retrieval quality is a number, and a
# number that is not checked drifts. This runs the same harness a developer runs
# locally and fails the build if any metric falls more than the tolerance below
# its committed baseline.
#
# Generation metrics are deliberately absent: they need GEMINI_API_KEY twice
# over, once to produce answers and once to grade them, which makes them a
# billed, non-deterministic job rather than a gate on every push. Run
# `sextant-judge` before a release instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The embedder and the cross-encoder are ~180 MB of downloads and do not
      # change between runs. Without this the model fetch dominates the job.
      - name: Cache models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-minilm-crossencoder-v1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy sextant tests

      - name: Unit tests
        run: pytest tests/ -q

      # Rebuilds the index from sextant/eval/corpus on every run, so this also proves
      # ingestion still works end to end.
      - name: Retrieval evaluation
        run: sextant-eval --check --out eval-results.json

      # The fourth part of the gate in CLAUDE.md, missing here until
      # 2026-10-07. `npm run build` runs `tsc -b` first, so a type error in the
      # frontend failed only for whoever typed the gate by hand and passed
      # every push. Node 22 because production builds on node:22-alpine; this
      # machine is on 20.12, which Vite 7 warns about and CI should not share.
      # The frontend half of the gate does not depend on the Python half, and a
      # gate command skipped because an unrelated step failed is a gate command
      # that did not run (item 12). So every step from here down carries the
      # same condition: `!cancelled()` rather than `always()`, which would also
      # burn minutes on a run somebody stopped on purpose.
      #
      # `if: always()` used to sit on the build alone, to keep the lint and the
      # type check independent. It reached further than that: a failing `Unit
      # tests` skipped `Frontend install`, the build ran anyway without
      # node_modules, and CI reported `Frontend build -> failure` with
      # `tsc: not found` on a tree whose frontend was fine. A condition that
      # reaches past a step's own prerequisite reports on something it never
      # had.
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm ci

      # Configured and committed at the UI port, run by nothing until now: the
      # lint result for this tree was unknown rather than green.
      - name: Frontend lint
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run build

      # The frontend had no test runner at all until 2026-10-24, which is why
      # `budget.durable` could be shipped by the server, declared by nothing,
      # read by nobody and noticed by no one for sixteen days. `tsc -b` above
      # type-checks these files; this runs them.
      - name: Frontend test
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval-results.json
